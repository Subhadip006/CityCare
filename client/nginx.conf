server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "
     default-src 'self';
     script-src 'self' https://accounts.google.com https://accounts.google.com/gsi https://apis.google.com 'unsafe-inline';
     style-src 'self' https://fonts.googleapis.com https://accounts.google.com 'unsafe-inline';
     font-src 'self' https://fonts.gstatic.com;
     connect-src 'self' http://localhost:8000 https://accounts.google.com https://accounts.google.com/gsi;
     img-src 'self' data: blob: https://res.cloudinary.com https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://unpkg.com;
     frame-src https://accounts.google.com;
     " always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;


    location / {
        try_files $uri $uri/ /index.html;
    }

   
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

   
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css application/xml font/woff2;
    gzip_min_length 256;
}
